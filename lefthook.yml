pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -l -w {staged_files} && git add {staged_files}
    govet:
      glob: "*.go"
      run: go vet ./...
    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --timeout=5m
    structlint:
      run: structlint validate

commit-msg:
  commands:
    conventional-commits:
      run: |
        msg=$(cat {1})
        pattern="^(feat|fix|docs|style|refactor|test|chore|build|ci|perf|revert)(\(.+\))?(!)?: .+"
        if ! echo "$msg" | grep -qE "$pattern"; then
          echo "Commit message must follow Conventional Commits format:"
          echo "  <type>[optional scope][!]: <description>"
          echo "  Types: feat|fix|docs|style|refactor|test|chore|build|ci|perf|revert"
          exit 1
        fi

pre-push:
  commands:
    govulncheck:
      run: govulncheck ./...
