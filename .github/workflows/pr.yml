name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|style|refactor|test|chore|build|ci|perf|revert)(\(.+\))?(!)?: .+/;
            if (!pattern.test(title)) {
              const body = `PR title must follow [Conventional Commits](https://www.conventionalcommits.org/) format:\n\n` +
                '`<type>[optional scope][!]: <description>`\n\n' +
                'Types: `feat|fix|docs|style|refactor|test|chore|build|ci|perf|revert`\n\n' +
                `Got: \`${title}\``;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              core.setFailed('PR title does not follow Conventional Commits format');
            }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run tests
        run: go test ./... -v -race -timeout 120s

  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Code Review
        uses: AxeForging/reviewforge@main
        with:
          model: gemini-2.5-flash
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

  structlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate project structure
        uses: AxeForging/structlint@main
