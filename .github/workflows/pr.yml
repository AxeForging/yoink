name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: AxeForging/reusable-workflows/actions/pr-title-lint@291855e85ec985d1d318df82b8f9dce969b76933
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: ${{ github.event.pull_request.title }}

  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: Build candidate and install external quality gates
        run: |
          QUALITY_BIN="$RUNNER_TEMP/quality-bin"
          mkdir -p "$QUALITY_BIN"
          go build -o "$QUALITY_BIN/yoink" .
          curl -fsSL https://raw.githubusercontent.com/AxeForging/structlint/main/install.sh | \
            STRUCTLINT_VERSION=v0.6.0 STRUCTLINT_INSTALL_DIR="$QUALITY_BIN" sh
          curl -fsSL https://raw.githubusercontent.com/AxeForging/dupehound/main/install.sh | \
            DUPEHOUND_VERSION=v0.1.0 DUPEHOUND_INSTALL_DIR="$QUALITY_BIN" sh
          echo "$QUALITY_BIN" >> "$GITHUB_PATH"

      - uses: AxeForging/gauntlet@v0.1.0
        with:
          since: origin/${{ github.base_ref }}

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Setup action installs a runnable binary
        uses: ./

      - name: Installed binary runs
        shell: bash
        run: yoink version

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: Build yoink
        run: go build -o yoink .

      - name: Create test scripts
        run: |
          # Script requiring 2 consecutive inputs
          cat > /tmp/interactive-setup.sh << 'SCRIPT'
          #!/bin/bash
          echo "=== Interactive Setup Wizard ==="
          echo "Step 1: What is your project name?"
          read -r PROJECT
          echo "Got project: $PROJECT"
          echo ""
          echo "Step 2: Enable logging? (yes/no)"
          read -r LOGGING
          echo "Got logging: $LOGGING"
          echo ""
          echo "=== Configuration Complete ==="
          echo "Project: $PROJECT"
          echo "Logging: $LOGGING"
          echo "Status: SUCCESS"
          exit 0
          SCRIPT
          chmod +x /tmp/interactive-setup.sh

          # Script that hangs until it gets confirmation
          cat > /tmp/confirm-deploy.sh << 'SCRIPT'
          #!/bin/bash
          echo "Building artifacts..."
          sleep 2
          echo "Build complete. 3 artifacts ready."
          echo ""
          echo "Deploy to production? (confirm/abort)"
          read -r CONFIRM
          if [ "$CONFIRM" = "confirm" ]; then
            echo "Deploying..."
            sleep 1
            echo "Deploy: COMPLETE"
            exit 0
          else
            echo "Deploy: ABORTED"
            exit 1
          fi
          SCRIPT
          chmod +x /tmp/confirm-deploy.sh

      - name: Start daemon
        run: |
          export YOINK_SOCK="/tmp/yoink-e2e.sock"
          echo "YOINK_SOCK=$YOINK_SOCK" >> $GITHUB_ENV
          ./yoink daemon &
          echo "DAEMON_PID=$!" >> $GITHUB_ENV
          sleep 1
          echo "Daemon started"

      - name: "Scenario 1: Spawn interactive script"
        run: |
          ./yoink run "/tmp/interactive-setup.sh"
          sleep 1

      - name: "Scenario 1: Verify process is running and waiting for input"
        run: |
          echo "--- Process list ---"
          ./yoink ls
          echo ""
          echo "--- Process log ---"
          OUTPUT=$(./yoink log 1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "What is your project name?" || (echo "FAIL: expected prompt not found" && exit 1)
          echo "PASS: First prompt detected"

      - name: "Scenario 1: Send first input (project name)"
        run: |
          ./yoink send 1 "my-awesome-app"
          echo "Sent first input"
          sleep 1

      - name: "Scenario 1: Verify first input processed, second prompt visible"
        run: |
          OUTPUT=$(./yoink log 1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Got project: my-awesome-app" || (echo "FAIL: first input not echoed" && exit 1)
          echo "$OUTPUT" | grep -q "Enable logging?" || (echo "FAIL: second prompt not found" && exit 1)
          echo "PASS: First input processed, second prompt shown"

      - name: "Scenario 1: Send second input (logging)"
        run: |
          ./yoink send 1 "yes"
          echo "Sent second input"
          sleep 1

      - name: "Scenario 1: Verify both inputs processed and script completed"
        run: |
          echo "--- Final log ---"
          OUTPUT=$(./yoink log 1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Got logging: yes" || (echo "FAIL: second input not echoed" && exit 1)
          echo "$OUTPUT" | grep -q "Status: SUCCESS" || (echo "FAIL: script did not complete" && exit 1)
          echo ""
          echo "--- Verify labeled output ---"
          echo "$OUTPUT" | grep -q "\[out\]" || (echo "FAIL: expected [out] labels" && exit 1)
          echo "$OUTPUT" | grep -q "\[in\]" || (echo "FAIL: expected [in] labels" && exit 1)
          echo ""
          echo "--- Process state ---"
          ./yoink ls
          echo ""
          echo "PASS: Interactive script completed with both inputs and labeled output"

      - name: "Scenario 2: Spawn deploy script (will hang waiting for confirm)"
        run: |
          ./yoink run "/tmp/confirm-deploy.sh"
          echo "Deploy script spawned as process 2"
          sleep 3

      - name: "Scenario 2: Verify build phase completed, waiting for confirm"
        run: |
          OUTPUT=$(./yoink log 2)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Build complete" || (echo "FAIL: build phase not done" && exit 1)
          echo "$OUTPUT" | grep -q "Deploy to production?" || (echo "FAIL: confirm prompt not found" && exit 1)
          echo "PASS: Deploy waiting for confirmation"

      - name: "Scenario 2: Send confirmation"
        run: |
          ./yoink send 2 "confirm"
          echo "Sent deploy confirmation"
          sleep 2

      - name: "Scenario 2: Verify deploy completed"
        run: |
          OUTPUT=$(./yoink log 2)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Deploy: COMPLETE" || (echo "FAIL: deploy not completed" && exit 1)
          echo ""
          echo "--- All processes ---"
          ./yoink ls
          echo ""
          echo "PASS: Deploy confirmed and completed"

      - name: "Scenario 3: Spawn a long-running process, then kill it"
        run: |
          ./yoink run "sleep 300"
          echo "Long-running process spawned as process 3"
          sleep 1
          echo ""
          echo "--- Before kill ---"
          ./yoink ls
          echo ""
          ./yoink kill 3
          sleep 1
          echo ""
          echo "--- After kill ---"
          ./yoink ls

      - name: "Verify: Multiple processes with different states"
        run: |
          echo "--- Full process table ---"
          ./yoink ls
          echo ""
          # Process 1: done (interactive script)
          # Process 2: done (deploy script)
          # Process 3: failed (killed sleep)
          echo "All 3 processes should be visible with correct states"

      - name: "Scenario 4: Send redacted input (password scenario)"
        run: |
          cat > /tmp/password-prompt.sh << 'SCRIPT'
          #!/bin/bash
          echo "Enter API token:"
          read -r TOKEN
          echo "Token received, length: ${#TOKEN}"
          echo "Authenticating..."
          echo "Auth: SUCCESS"
          SCRIPT
          chmod +x /tmp/password-prompt.sh

          ./yoink run "/tmp/password-prompt.sh"
          echo "Password prompt spawned as process 4"
          sleep 1

      - name: "Scenario 4: Send redacted token"
        run: |
          OUTPUT=$(./yoink log 4)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Enter API token" || (echo "FAIL: token prompt not found" && exit 1)
          echo ""
          ./yoink send-redacted 4 "sk-super-secret-token-12345"
          echo "Sent redacted token"
          sleep 1

      - name: "Scenario 4: Verify token is redacted in logs"
        run: |
          OUTPUT=$(./yoink log 4)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Auth: SUCCESS" || (echo "FAIL: auth did not succeed" && exit 1)
          echo "$OUTPUT" | grep -q "\*\*\*\*\*\*\*\*" || (echo "FAIL: expected redacted marker" && exit 1)
          if echo "$OUTPUT" | grep -q "sk-super-secret"; then
            echo "FAIL: secret token visible in logs!"
            exit 1
          fi
          echo "PASS: Token was sent but redacted in logs"

      - name: "Scenario 5: Wait for a fast process (already done)"
        run: |
          ./yoink run --alias wait-fast "echo wait-pipeline-test"
          sleep 1
          OUTPUT=$(./yoink wait wait-fast --timeout 5 --poll 1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "wait-pipeline-test" || (echo "FAIL: expected output not streamed" && exit 1)
          echo "PASS: Wait returned immediately for finished process"

      - name: "Scenario 5: Wait for a slow process with streaming"
        run: |
          ./yoink run --alias wait-slow "sh -c 'echo step-1; sleep 2; echo step-2; sleep 2; echo step-3'"
          OUTPUT=$(./yoink wait wait-slow --timeout 15 --poll 1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "step-1" || (echo "FAIL: expected step-1" && exit 1)
          echo "$OUTPUT" | grep -q "step-3" || (echo "FAIL: expected step-3" && exit 1)
          echo "PASS: Wait streamed output and detected completion"

      - name: "Scenario 5: Wait with timeout (should fail with exit 124)"
        run: |
          ./yoink run --alias wait-timeout "sleep 300"
          sleep 1
          set +e
          OUTPUT=$(./yoink wait wait-timeout --timeout 3 --poll 1 --message "build exceeded time budget" 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          echo "Exit code: $EXIT_CODE"
          [ "$EXIT_CODE" -eq 124 ] || (echo "FAIL: expected exit code 124, got $EXIT_CODE" && exit 1)
          echo "$OUTPUT" | grep -q "build exceeded time budget" || (echo "FAIL: expected custom message" && exit 1)
          echo "PASS: Timeout exits 124 with custom message"
          ./yoink kill wait-timeout
          sleep 1

      - name: "Scenario 5: Wait for multiple processes at once"
        run: |
          ./yoink run --alias wait-ma "sh -c 'sleep 1; echo done-a'"
          ./yoink run --alias wait-mb "sh -c 'sleep 2; echo done-b'"
          OUTPUT=$(./yoink wait wait-ma wait-mb --timeout 10 --poll 1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "\[wait-ma\]" || (echo "FAIL: expected [wait-ma] label" && exit 1)
          echo "$OUTPUT" | grep -q "\[wait-mb\]" || (echo "FAIL: expected [wait-mb] label" && exit 1)
          echo "$OUTPUT" | grep -q "done-a" || (echo "FAIL: expected done-a" && exit 1)
          echo "$OUTPUT" | grep -q "done-b" || (echo "FAIL: expected done-b" && exit 1)
          echo "PASS: Multi-wait returned after all processes finished with labeled output"

      - name: "Scenario 5: Wait for a failed process (should propagate exit code)"
        run: |
          ./yoink run --alias wait-fail "sh -c 'echo failing-now; exit 3'"
          sleep 1
          set +e
          OUTPUT=$(./yoink wait wait-fail --timeout 5 --poll 1 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          echo "Exit code: $EXIT_CODE"
          [ "$EXIT_CODE" -eq 3 ] || (echo "FAIL: expected exit code 3, got $EXIT_CODE" && exit 1)
          echo "$OUTPUT" | grep -q "failing-now" || (echo "FAIL: expected output before failure" && exit 1)
          echo "PASS: Wait propagated process exit code"

      - name: "Clean up finished processes"
        run: |
          ./yoink clean
          echo ""
          echo "--- After clean ---"
          ./yoink ls

      - name: Stop daemon
        if: always()
        run: |
          kill $DAEMON_PID 2>/dev/null || true
          rm -f "$YOINK_SOCK"

  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: AxeForging/reviewforge@main
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: gemini
          AI_MODEL: gemini-2.5-flash
          AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOW_TOKEN_USAGE: true
          INCREMENTAL: false
          REVIEW_RULES: concise
