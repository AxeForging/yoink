version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitCommit={{.FullCommit}}
    ignore:
      - goos: windows
        goarch: arm

archives:
  - formats:
      - tar.gz
    name_template: "yoink-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - LICENSE
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: AxeForging
    name: yoink
  draft: false
  prerelease: auto
  header: |
    ## Installation

    ### One-liner (auto-detects OS/arch)
    ```bash
    curl -fsSL https://raw.githubusercontent.com/AxeForging/yoink/main/install.sh | sh
    # pin a version: VERSION={{ .Tag }} sh -c "$(curl -fsSL https://raw.githubusercontent.com/AxeForging/yoink/main/install.sh)"
    ```

    ### GitHub Actions
    ```yaml
    - uses: AxeForging/yoink@{{ .Tag }}
    - run: yoink run --alias dev "npm run dev"
    ```

    ### Manual (pick your arch)
    ```bash
    # Linux amd64 — swap the suffix for darwin-arm64, linux-arm64, etc.
    curl -fsSL https://github.com/AxeForging/yoink/releases/download/{{ .Tag }}/yoink-linux-amd64.tar.gz | tar xz
    chmod +x yoink && sudo mv yoink /usr/local/bin/
    ```

    ### From source
    ```bash
    go install github.com/AxeForging/yoink@{{ .Tag }}
    ```
